<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vai liberar o precioso?</title>
<style>
  :root {
    --bg: #0a0a0a;
    --ink: #ffffff;
    --yes: #2f7a4f;
    --yes-dark: #235c3b;
    --no: #b6432c;
  }

  @keyframes rainbow {
    0%   { color: #ff0040; }
    16%  { color: #ff8c00; }
    33%  { color: #ffee00; }
    50%  { color: #2fff4f; }
    66%  { color: #00c8ff; }
    83%  { color: #a259ff; }
    100% { color: #ff0040; }
  }

  .precioso {
    animation: rainbow 3s linear infinite;
    font-weight: 700;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--ink);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
  }

  h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 400;
    max-width: 700px;
    line-height: 1.25;
    margin: 0 0 48px;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  button {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 16px 42px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  #yes {
    background: var(--yes);
    color: #fdf6ec;
    box-shadow: 0 6px 0 var(--yes-dark);
    transition: transform 0.1s ease;
  }
  #yes:active {
    transform: translateY(3px);
  }

  #no {
    background: transparent;
    color: var(--no);
    border: 2px solid var(--no);
  }

  #no.fugindo {
    position: fixed;
    z-index: 50;
  }

  #result {
    margin-top: 40px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #result.show {
    display: flex;
  }

  #result p {
    font-size: 22px;
    color: var(--yes-dark);
    margin: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  #catImg {
    max-width: 260px;
    width: 70vw;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    opacity: 0;
    transform: scale(0.8);
    animation: popIn 0.4s ease forwards 0.15s;
  }

  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }

  /* confete */
  .confete {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 16px;
    z-index: 999;
    pointer-events: none;
    animation: cair linear forwards;
  }

  @keyframes cair {
    to {
      transform: translateY(110vh) rotate(720deg);
    }
  }
</style>
</head>

<script>
  var noBtn = document.getElementById('no');
  var yesBtn = document.getElementById('yes');
  var result = document.getElementById('result');
  var audioSim = document.getElementById('audioSim');
  var audioNao = document.getElementById('audioNao');
  var catVideo = document.getElementById('catVideo');

  function tocarAudioNao() {
    try {
      audioNao.currentTime = 0;
      audioNao.play();
    } catch (e) {}
  }

  function moveNoButton() {
    if (!noBtn.classList.contains('fugindo')) {
      noBtn.classList.add('fugindo');
    }

    var w = noBtn.offsetWidth;
    var h = noBtn.offsetHeight;
    var margin = 16;

    var maxX = window.innerWidth - w - margin;
    var maxY = window.innerHeight - h - margin;

    var yesRect = yesBtn.getBoundingClientRect();
    var x, y, tentativas = 0;

    do {
      x = margin + Math.random() * (maxX - margin);
      y = margin + Math.random() * (maxY - margin);
      tentativas++;
    } while (
      tentativas < 15 &&
      x < yesRect.right + 10 && x + w > yesRect.left - 10 &&
      y < yesRect.bottom + 10 && y + h > yesRect.top - 10
    );

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }

  window.addEventListener('resize', function () {
    if (noBtn.classList.contains('fugindo')) moveNoButton();
  });

  noBtn.addEventListener('click', function (e) {
    e.preventDefault();
    tocarAudioNao();
    moveNoButton();
  });

  var cores = ['#ff0040', '#ff8c00', '#ffee00', '#2fff4f', '#00c8ff', '#a259ff'];

  function lancarConfete() {
    var qtd = 80;
    for (var i = 0; i < qtd; i++) {
      var el = document.createElement('div');
      el.className = 'confete';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = cores[Math.floor(Math.random() * cores.length)];
      el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(el);
      (function (elemento) {
        elemento.addEventListener('animationend', function () {
          elemento.remove();
        });
      })(el);
    }
  }

  // toca um "yupiiii" gerado na hora, sem precisar de arquivo
  function tocarSom() {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      var ctx = new AudioCtx();
      var agora = ctx.currentTime;

      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var vibrato = ctx.createOscillator();
      var vibratoGain = ctx.createGain();

      osc.type = 'sawtooth';

      // sobe rápido tipo um assobio empolgado, depois estabiliza
      osc.frequency.setValueAtTime(300, agora);
      osc.frequency.exponentialRampToValueAtTime(1000, agora + 0.22);
      osc.frequency.exponentialRampToValueAtTime(850, agora + 0.32);

      // um pequeno vibrato pra dar aquele "iiii" de empolgação
      vibrato.frequency.value = 14;
      vibratoGain.gain.value = 25;
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc.frequency);

      gain.gain.setValueAtTime(0, agora);
      gain.gain.linearRampToValueAtTime(0.3, agora + 0.05);
      gain.gain.setValueAtTime(0.3, agora + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.001, agora + 0.75);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(agora);
      vibrato.start(agora);
      osc.stop(agora + 0.75);
      vibrato.stop(agora + 0.75);
    } catch (e) {
      // se o navegador bloquear áudio, o resto da página continua normal
    }
  }

  yesBtn.addEventListener('click', function () {
    try {
      audioSim.currentTime = 0;
      audioSim.play();
    } catch (e) {}
    lancarConfete();
    result.classList.add('show');
    catVideo.style.display = 'block';
    try {
      catVideo.currentTime = 0;
      catVideo.play();
    } catch (e) {}
  });
</script>
